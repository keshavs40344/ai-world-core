      </div>

  <script>
    function parseCSVLine(line) {
      const result = [];
      let startValueIndex = 0;
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          let val = line.substring(startValueIndex, i).trim();
          if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1).replace(/""/g, '"');
          result.push(val);
          startValueIndex = i + 1;
        }
      }
      let lastVal = line.substring(startValueIndex).trim();
      if (lastVal.startsWith('"') && lastVal.endsWith('"')) lastVal = lastVal.slice(1, -1).replace(/""/g, '"');
      result.push(lastVal);
      return result;
    }

    function convertCSV() {
      const text = document.getElementById('csvInput').value.trim();
      if (!text) {
        document.getElementById('jsonOutput').textContent = "// Please enter valid CSV data";
        return;
      }
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      if (lines.length < 1) return;

      const headers = parseCSVLine(lines[0]);
      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => {
          let raw = values[idx] !== undefined ? values[idx] : "";
          if (raw.toLowerCase() === 'true') obj[h] = true;
          else if (raw.toLowerCase() === 'false') obj[h] = false;
          else if (!isNaN(raw) && raw !== '') obj[h] = Number(raw);
          else obj[h] = raw;
        });
        rows.push(obj);
      }

      document.getElementById('jsonOutput').textContent = JSON.stringify(rows, null, 2);
      document.getElementById('stats').textContent = `Parsed ${rows.length} record(s) & ${headers.length} column(s)`;
    }

    function clearAll() {
      document.getElementById('csvInput').value = '';
      document.getElementById('jsonOutput').textContent = '// Output will appear here';
      document.getElementById('stats').textContent = '';
    }

    function copyOutput() {
      const out = document.getElementById('jsonOutput').textContent;
      navigator.clipboard.writeText(out);
      alert('JSON copied to clipboard!');
    }
  </script>
