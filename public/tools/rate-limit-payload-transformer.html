<!DOCTYPE html><html><body><h1>API Transformer</h1><textarea id="in" rows="4" cols="40">{"id": 1}</textarea><button onclick="fetch('/api/transform',{method:'POST',body:document.getElementById('in').value}).then(r=>r.json()).then(d=>document.getElementById('out').innerText=JSON.stringify(d))">Transform</button><pre id="out"></pre></body></html>
