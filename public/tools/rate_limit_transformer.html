<!DOCTYPE html><html><head><title>API Transformer</title></head><body><textarea id='in' rows='4' cols='50'>{'limit':5,'body':{'name':'test'}}</textarea><button onclick='run()'>Run</button><pre id='out'></pre><script>async function run(){const r=await fetch('/api/engine',{method:'POST',body:document.getElementById('in').value});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
