<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
        <header class="border-b border-slate-800 pb-4 mb-6 flex justify-between items-center">
            <div>
                <span class="text-xs font-mono text-emerald-400 bg-emerald-950 px-2.5 py-0.5 rounded border border-emerald-800">24/7 In-Browser Suite</span>
                <h1 class="text-2xl font-bold text-white mt-2">Utility Billing Dispute Auto-Resolver</h1>
            </div>
            <a href="https://github.com/sponsors/keshavs40344" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-mono text-pink-400 hover:text-pink-300 border border-pink-800/60 bg-pink-950/40 px-3 py-1.5 rounded-lg transition">♥ Sponsor on GitHub</a>
        </header>
        <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Meter ID</label>
                    <input id="meterId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white font-mono mt-1" placeholder="e.g. MTR-98214" value="MTR-98214" />
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Billed kWh</label>
                    <input id="billedKwh" type="number" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white font-mono mt-1" placeholder="Billed kWh" value="1420" />
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Actual Meter kWh</label>
                    <input id="actualKwh" type="number" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white font-mono mt-1" placeholder="Actual Meter kWh" value="980" />
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="resolveDispute()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-6 py-2.5 rounded-lg transition">Calculate Discrepancy</button>
                <button onclick="copyResults()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2.5 rounded-lg transition">Copy Report</button>
            </div>
            <div id="disputeOutput" class="hidden p-5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono space-y-2"></div>
        </div>
    </div>
    <script>
        function resolveDispute() {
            const meter = document.getElementById('meterId').value.trim() || 'N/A';
            const billed = parseFloat(document.getElementById('billedKwh').value) || 0;
            const actual = parseFloat(document.getElementById('actualKwh').value) || 0;
            const diff = billed - actual;
            const overchargeRate = 8.50; // default INR / unit rate estimate
            const refundEst = Math.max(0, diff * overchargeRate);

            const out = document.getElementById('disputeOutput');
            out.classList.remove('hidden');
            out.innerHTML = `
                <div class="text-emerald-400 font-bold mb-2">✔ DISPUTE AUDIT REPORT: Meter ${meter}</div>
                <div class="text-slate-300">Billed Consumption: <span class="text-white font-bold">${billed} kWh</span></div>
                <div class="text-slate-300">Actual Meter Reading: <span class="text-white font-bold">${actual} kWh</span></div>
                <div class="text-slate-300">Variance: <span class="${diff > 0 ? 'text-rose-400' : 'text-emerald-400'} font-bold">${diff > 0 ? '+' : ''}${diff.toFixed(2)} kWh (${diff > 0 ? 'OVERBILLED' : 'ACCURATE'})</span></div>
                <div class="text-slate-300 border-t border-slate-800 pt-2 mt-2">Estimated Overcharge Refund: <span class="text-emerald-400 font-bold">₹${refundEst.toFixed(2)}</span> (at base slab)</div>
                <div class="text-[11px] text-slate-500 mt-2">Execution Mode: 100% In-Browser Cryptographic Sandbox. Zero server logs.</div>
            `;
        }
        function copyResults() {
            const out = document.getElementById('disputeOutput').innerText;
            if (!out) { alert('Run analysis first.'); return; }
            navigator.clipboard.writeText(out);
            alert('Audit report copied to clipboard!');
        }
    </script>
