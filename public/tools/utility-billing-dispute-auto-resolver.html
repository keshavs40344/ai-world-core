<html><body><h3>Billing Dispute Checker</h3><input id='m' placeholder='Meter ID'><input id='b' type='number' placeholder='Billed kWh'><input id='t' type='number' placeholder='Meter kWh'><button onclick='check()'>Check</button><pre id='out'></pre><script>async function check(){const r=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meter_id:document.getElementById('m').value,billed_kwh:parseFloat(document.getElementById('b').value),meter_kwh:parseFloat(document.getElementById('t').value)})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);}</script></body></html>
