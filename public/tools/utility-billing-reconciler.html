<!DOCTYPE html><html><body><h3>Reconcile</h3><input id='p' placeholder='JSON: {meter_id, billed_kwh, meter_kwh}'><button onclick='run()'>Check</button><pre id='o'></pre><script>async function run(){const r=await fetch('/api/engine',{method:'POST',headers:{'Content-Type':'application/json'},body:document.getElementById('p').value});document.getElementById('o').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
