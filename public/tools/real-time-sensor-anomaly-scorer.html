<!DOCTYPE html><html><body><input id='v' placeholder='Value'><input id='t' placeholder='Threshold' value='85'><button onclick='run()'>Check</button><pre id='out'></pre><script>function run(){fetch('/api/execute',{method:'POST',body:JSON.stringify({value:parseFloat(document.getElementById('v').value),threshold:parseFloat(document.getElementById('t').value)})}).then(r=>r.json()).then(d=>document.getElementById('out').textContent=JSON.stringify(d))}</script></body></html>
