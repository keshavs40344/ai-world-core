<!DOCTYPE html><html><head><title>Rate Limiter</title></head><body><textarea id='in' style='width:100%;height:100px'>{"key":"value"}</textarea><button onclick='run()'>Transform</button><pre id='out'></pre><script>async function run(){const r=await fetch('/api/engine',{method:'POST',body:document.getElementById('in').value});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
