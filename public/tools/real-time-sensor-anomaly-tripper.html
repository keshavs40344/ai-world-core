<html><body><h1>Energy Sensor Monitor</h1><input id='val' type='number' placeholder='Value'><button onclick='check()'>Check</button><div id='out'></div><script>function check(){fetch('/api/engine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:parseFloat(document.getElementById('val').value),threshold:50})}).then(r=>r.json()).then(d=>document.getElementById('out').innerText=JSON.stringify(d))}</script></body></html>
