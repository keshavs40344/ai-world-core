<!DOCTYPE html><html><body><textarea id='in' style='width:100%;height:100px'></textarea><button onclick='run()'>Process</button><div id='out'></div><script>async function run(){const r=await fetch('/api/engine',{method:'POST',body:document.getElementById('in').value});document.getElementById('out').innerText=JSON.stringify(await r.json());}</script></body></html>
