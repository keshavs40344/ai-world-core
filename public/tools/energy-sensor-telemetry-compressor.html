<!DOCTYPE html><html><body><h3>Telemetry Compressor</h3><textarea id='in' rows='4' cols='50'>{'temp': 85, 'voltage': 120}</textarea><button onclick='run()'>Compress</button><pre id='out'></pre><script>async function run(){const r=await fetch('/api/execute',{method:'POST',body:document.getElementById('in').value});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
