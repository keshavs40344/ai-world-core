<!DOCTYPE html><html><head><title>API Transformer</title></head><body><textarea id='in' rows='4' cols='50'>{"key": "value"}</textarea><button onclick="run()">Transform</button><pre id='out'></pre><script>async function run(){const r=await fetch('/api/transform',{method:'POST',body:document.getElementById('in').value});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
