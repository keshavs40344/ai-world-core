<!DOCTYPE html><html><head><style>body{font-family:sans-serif;padding:20px}textarea{width:100%;height:100px}button{margin-top:10px;padding:10px}</style></head><body><h2>Maze Feedback Engine</h2><textarea id='input'>{"feedback":[]}</textarea><button onclick='run()'>Analyze</button><pre id='output'></pre><script>async function run(){const r=await fetch('/api/run',{method:'POST',body:document.getElementById('input').value});document.getElementById('output').textContent=await r.text()}</script></body></html>
