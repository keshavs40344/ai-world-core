<div id='app'>
  <input id='data' placeholder='JSON: {"values": [1,2,3]}'>
  <button onclick="fetch('/api/execute',{method:'POST',body:document.getElementById('data').value}).then(r=>r.json()).then(d=>document.getElementById('out').textContent=JSON.stringify(d))">Analyze</button>
  <pre id='out'></pre>
</div>
