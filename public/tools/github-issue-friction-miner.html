<body>
    <div class="container">
        <h2>GitHub Issue Friction Analyzer</h2>
        <p>Paste raw GitHub issue text below to detect technical and socio-technical friction points.</p>
        <textarea id="inputText" placeholder="Paste issue content here..."></textarea>
        <button onclick="analyze()">Analyze Friction</button>
        <div id="results"></div>
    </div>
    <script>
        async function analyze() {
            const payload = document.getElementById('inputText').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Analyzing...</p>';
            
            try {
                // In a real deployment, this would call the endpoint
                // For demo, we simulate the logic or call a local mock
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payload: payload })
                });
                const data = await response.json();
                
                if (data.status === 'SUCCESS') {
                    let html = '<h3>Detected Friction Points:</h3>';
                    if (data.friction_points.length === 0) {
                        html += '<p>No specific friction points detected.</p>';
                    } else {
                        data.friction_points.forEach(point => {
                            html += `<div class="friction-item">
                                <span class="category">${point.category}</span>
                                <p>"${point.context_snippet}"</p>
                            </div>`;
                        });
                    }
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `<p style="color:red">Error: ${data.message}</p>`;
                }
            } catch (e) {
                resultsDiv.innerHTML = `<p style="color:red">Request failed: ${e.message}</p>`;
            }
        }
    </script>
