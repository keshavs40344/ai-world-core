<html><body><h1>Grid Monitor</h1><input id='v' placeholder='Voltage'><button onclick='check()'>Check</button><div id='r'></div><script>function check(){fetch('/api',{method:'POST',body:JSON.stringify({voltage:document.getElementById('v').value})}).then(r=>r.json()).then(d=>document.getElementById('r').innerText=JSON.stringify(d))}</script></body></html>
