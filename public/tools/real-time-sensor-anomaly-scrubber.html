<!DOCTYPE html><html><head><style>body{font-family:sans-serif;padding:20px}</style></head><body><h3>Energy Sensor Scrubber</h3><textarea id='in' rows='4' cols='50'>{'readings':[{'value':50},{'value':150}]}</textarea><button onclick='run()'>Process</button><pre id='out'></pre><script>async function run(){const r=await fetch('/api/engine',{method:'POST',headers:{'Content-Type':'application/json'},body:document.getElementById('in').value});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
