<!DOCTYPE html><html><head><title>API Transformer</title></head><body><textarea id='inp'></textarea><button onclick='run()'>Transform</button><pre id='out'></pre><script>async function run(){const r=await fetch('/api/transform',{method:'POST',body:document.getElementById('inp').value});document.getElementById('out').textContent=JSON.stringify(await r.json());}</script></body></html>
