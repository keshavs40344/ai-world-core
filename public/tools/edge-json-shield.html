<!DOCTYPE html><html><head><title>Edge JSON Shield</title></head><body><h2>Edge JSON Shield</h2><p>Validate and sanitize JSON payloads for lightweight microservices.</p><textarea id="input" rows="10" cols="50">{"user": "test", "meta": null}</textarea><button onclick="test()">Execute</button><pre id="output"></pre><script>function test(){fetch('https://api.rapidapi.com/edge-json-shield', {method:'POST', body: document.getElementById('input').value}).then(r=>r.json()).then(d=>document.getElementById('output').innerText=JSON.stringify(d,null,2));}</script></body></html>
