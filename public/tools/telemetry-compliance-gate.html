<!DOCTYPE html><html><body><input id='v' type='number' placeholder='Value'><input id='t' type='number' placeholder='Threshold'><button onclick='run()'>Check</button><div id='out'></div><script>async function run(){const r=await fetch('/api/engine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:parseFloat(document.getElementById('v').value),threshold:parseFloat(document.getElementById('t').value)})});document.getElementById('out').innerText=JSON.stringify(await r.json());}</script></body></html>
