<!DOCTYPE html><html><head><title>CSV to MongoDB Schema Normalizer</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-900 text-white p-4"><h1 class="text-2xl font-bold mb-4">CSV to MongoDB Schema Normalizer</h1><textarea id="csv" class="w-full h-32 bg-gray-800 p-2 rounded mb-2" placeholder="Paste CSV data here..."></textarea><button onclick="run()" class="bg-blue-600 px-4 py-2 rounded">Normalize</button><pre id="out" class="mt-4 bg-gray-800 p-2 rounded overflow-auto h-64"></pre><script>function run(){const r=new FileReader();const t=document.getElementById('csv').value;const rows=t.split('\n').map(l=>l.split(','));const h=rows[0];const s={};const d=[];rows.slice(1).forEach(r=>{const o={};h.forEach((k,i)=>{const v=r[i];if(!v)return;const t=v==='true'||v==='false'?'bool':v.replace('.','',1).match(/^-?\d+$/)?'int':v.match(/^-?\d+\.\d+$/)?'float':'str';s[k]=s[k]||new Set();s[k].add(t);o[k]=t==='bool'?v==='true':t==='int'?parseInt(v):t==='float'?parseFloat(v):v});d.push(o)});document.getElementById('out').textContent=JSON.stringify({schema:Object.fromEntries(Object.entries(s).map(([k,v])=>[k,v.size===1?[...v][0]:'mixed'])),documents:d},null,2)}</script></body></html>
