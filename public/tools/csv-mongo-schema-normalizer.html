<!DOCTYPE html><html><head><title>CSV Mongo Normalizer</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-900 text-white p-4"><h1 class="text-2xl font-bold mb-4">CSV to MongoDB Schema Normalizer</h1><textarea id="csv" class="w-full h-32 bg-gray-800 p-2 rounded mb-2" placeholder="Paste CSV data here..."></textarea><button onclick="run()" class="bg-blue-600 px-4 py-2 rounded">Normalize</button><pre id="out" class="mt-4 bg-gray-800 p-2 rounded overflow-auto h-64">Result will appear here...</pre><script>function run(){const d=document.getElementById('csv').value;fetch('/api/normalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv_data:d})}).then(r=>r.json()).then(j=>document.getElementById('out').textContent=JSON.stringify(j,null,2)).catch(e=>document.getElementById('out').textContent='Error: '+e);}</script></body></html>
