<body class="min-h-screen p-6 md:p-12 flex flex-col items-center justify-center">
  <div class="max-w-4xl w-full bg-slate-900/90 border border-cyan-500/30 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 text-xs font-mono border border-cyan-500/40">CIVILIZATION PRODUCT v1.0</span>
          <span class="text-xs font-mono text-emerald-400">FinTech FX Arbitrage</span>
        </div>
        <h1 class="text-2xl font-bold text-white mt-1">ForexSpread -- Cross-Border Remittance Net Yield</h1>
      </div>
      <a href="../civilization_control_center.html" class="text-xs font-mono text-slate-400 hover:text-cyan-400">&larr; Control Center</a>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono text-xs">
      <div>
        <label class="text-slate-300 block mb-1">Inward USD Invoice Amount ($):</label>
        <input id="usdAmount" type="number" value="5000" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-cyan-300 focus:outline-none">
      </div>
      <div>
        <label class="text-slate-300 block mb-1">Bank Conversion Markup (%):</label>
        <input id="bankMarkup" type="number" value="1.8" step="0.1" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-cyan-300 focus:outline-none">
      </div>
    </div>
    <button onclick="calcSpread()" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-black font-bold text-xs rounded-xl font-mono transition">
      Compute Net Realized INR & Avoided Loss
    </button>
    <div id="fxResults" class="hidden p-4 rounded-xl border border-cyan-500/30 bg-slate-950 font-mono text-xs space-y-2">
      <div class="flex justify-between border-b border-slate-800 pb-2">
        <span class="text-slate-400">Interbank Mid-Market Rate:</span>
        <span class="text-white">1 USD = &#8377;86.40</span>
      </div>
      <div class="flex justify-between border-b border-slate-800 pb-2">
        <span class="text-slate-400">Gross Value:</span>
        <span id="grossInr" class="text-emerald-400 font-bold"></span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">Hidden Bank FX Fee (Loss):</span>
        <span id="feeLoss" class="text-rose-400 font-bold"></span>
      </div>
    </div>
  </div>
  <script>
    function calcSpread() {
      const usd = parseFloat(document.getElementById('usdAmount').value) || 0;
      const markup = parseFloat(document.getElementById('bankMarkup').value) || 0;
      const rate = 86.40;
      const gross = usd * rate;
      const loss = gross * (markup / 100);
      const net = gross - loss;
      document.getElementById('fxResults').classList.remove('hidden');
      document.getElementById('grossInr').innerHTML = '&#8377;' + net.toLocaleString('en-IN', {maximumFractionDigits: 2}) + ' (Net Realized)';
      document.getElementById('feeLoss').innerHTML = '-&#8377;' + loss.toLocaleString('en-IN', {maximumFractionDigits: 2}) + ' (' + markup + '%)';
    }
  </script>
