    <label class="block">

    </label>
    <label class="block">

      <input type="number" id="deduction80D" min="0" step="1000" placeholder="e.g., 25000"

    </label>
    <label class="block">

      <input type="number" id="deductionHRA" min="0" step="1000" placeholder="e.g., 120000"
        class="mt-1 block w-full rounded-md bg-gray-800 text-gray-100 border-gray-700 focus:border-indigo-500 focus:ring-indigo-500">
    </label>
  </div>

  <button id="calculateBtn" class="mt-6 w-full md:w-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-md flex items-center justify-center gap-2">
    <lucide-icon name="calculator" size="20"></lucide-icon>
    Calculate
  </button>

  <!-- Output Section -->
  <div id="output" class="mt-8 space-y-6"></div>
</div>

<script>
  // Utility Functions
  const formatCurrency = (val) => `₹${Number(val).toLocaleString('en-IN')}`;
  const formatNumber = (val) => Number(val).toLocaleString('en-IN');

  // Tax Calculation Functions
  function calculateTaxOld(taxable) {
    let tax = 0;
    const breakdown = [];
    let remaining = taxable;

    const slabs = [
      { limit: 250000, rate: 0 },
      { limit: 250000, rate: 0.05 },
      { limit: 500000, rate: 0.20 },
      { limit: Infinity, rate: 0.30 }
    ];

    for (const slab of slabs) {
      if (remaining <= 0) break;
      const taxableInSlab = Math.min(remaining, slab.limit);
      const taxInSlab = taxableInSlab * slab.rate;
      tax += taxInSlab;
      breakdown.push({
        slab: slab.rate === 0 ? '0-2.5L' : (slab.rate === 0.05 ? '2.5-5L' : (slab.rate === 0.20 ? '5-10L' : '>10L')),
        tax: taxInSlab
      });
      remaining -= taxableInSlab;
    }

    const rebate = taxable <= 500000 ? Math.min(1250, tax) : 0;
    const netTax = tax - rebate;

    return { tax, rebate, netTax, breakdown };
  }

    }

    return { tax, rebate, netTax, breakdown };
