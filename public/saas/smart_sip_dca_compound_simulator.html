<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<title>Smart SIP & DCA Compound Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {font-family: 'Inter', sans-serif;}
  .error {color: #f87171;}
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <header class="p-4 bg-gray-800 shadow-md">
    <h1 class="text-2xl font-semibold flex items-center gap-2">
      <i data-lucide="calculator"></i>
      Smart SIP & DCA Compound Simulator
    </h1>
  </header>

  <main class="flex-1 p-4 max-w-5xl mx-auto w-full">
    <!-- Controls -->
    <section class="bg-gray-800 rounded-lg p-6 mb-6 shadow">
      <h2 class="text-xl font-semibold mb-4">Simulation Parameters</h2>
      <form id="simForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium mb-1">Investment Type</label>
          <select id="investmentType" class="w-full p-2 rounded bg-gray-700 text-gray-200">
            <option value="sip">SIP (Inflation‑Adjusted)</option>
            <option value="dca">DCA (Fixed Contribution)</option>
          </select>
        </div>
        <div>
          <label class="block font-medium mb-1">Periodicity</label>
          <select id="periodicity" class="w-full p-2 rounded bg-gray-700 text-gray-200">
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div>
          <label class="block font-medium mb-1">Initial Contribution</label>
          <input type="number" id="initialAmount" min="0" step="0.01" placeholder="e.g., 5000" class="w-full p-2 rounded bg-gray-700 text-gray-200">
        </div>
        <div>
          <label class="block font-medium mb-1">Contribution per Period</label>
          <input type="number" id="periodAmount" min="0" step="0.01" placeholder="e.g., 500" class="w-full p-2 rounded bg-gray-700 text-gray-200">
        </div>
        <div>
          <label class="block font-medium mb-1">Duration (Years)</label>
          <input type="number" id="duration" min="1" step="1" placeholder="e.g., 10" class="w-full p-2 rounded bg-gray-700 text-gray-200">
        </div>
        <div>
          <label class="block font-medium mb-1">Expected Annual Return (%)</label>
          <input type="number" id="annualReturn" min="0" step="0.01" placeholder="e.g., 8" class="w-full p-2 rounded bg-gray-700 text-gray-200">
        </div>
        <div>
          <label class="block font-medium mb-1">Inflation Rate (%)</label>
          <input type="number" id="inflationRate" min="0" step="0.01" placeholder="e.g., 3" class="w-full p-2 rounded bg-gray-700 text-gray-200">
        </div>
        <div class="md:col-span-2 flex justify-end gap-4">
          <button type="button" id="runSim" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 transition">
            <i data-lucide="play"></i> Run Simulation
          </button>
          <button type="button" id="resetForm" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-700 transition">
            <i data-lucide="refresh-cw"></i> Reset
          </button>
        </div>
      </form>
    </section>

    <!-- Output Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-gray-800 rounded-lg p-4 shadow">
        <h3 class="font-semibold mb-2">Total Invested</h3>
        <p id="totalInvested" class="text-2xl font-medium text-blue-400"></p>
      </div>
      <div class="bg-gray-800 rounded-lg p-4 shadow">
        <h3 class="font-semibold mb-2">Total Returns</h3>
        <p id="totalReturns" class="text-2xl font-medium text-green-400"></p>
      </div>
      <div class="bg-gray-800 rounded-lg p-4 shadow">
        <h3 class="font-semibold mb-2">CAGR</h3>
        <p id="cagr" class="text-2xl font-medium text-yellow-400"></p>
      </div>
    </section>

    <!-- Chart -->
    <section class="bg-gray-800 rounded-lg p-4 shadow mb-6">
      <h3 class="font-semibold mb-4">Growth Over Time</h3>
      <canvas id="growthChart" height="200"></canvas>
    </section>

    <!-- Export -->
    <section class="flex justify-end gap-4">
      <button id="copyOutput" class="px-4 py-2 bg-green-600 rounded hover:bg-green-700 transition flex items-center gap-2">
        <i data-lucide="copy"></i> Copy Summary
      </button>
      <button id="downloadCSV" class="px-4 py-2 bg-indigo-600 rounded hover:bg-indigo-700 transition flex items-center gap-2">
        <i data-lucide="download"></i> Download CSV
      </button>
    </section>
  </main>

  <footer class="p-4 bg-gray-800 text-center text-sm">
    © 2026 Smart SIP & DCA Simulator
  </footer>

<script>
lucide.createIcons();

const form = document.getElementById('simForm');
const runBtn = document.getElementById('runSim');
const resetBtn = document.getElementById('resetForm');
const copyBtn = document.getElementById('copyOutput');
const downloadBtn = document.getElementById('downloadCSV');

const totalInvestedEl = document.getElementById('totalInvested');
const totalReturnsEl = document.getElementById('totalReturns');
const cagrEl = document.getElementById('cagr');
const chartCtx = document.getElementById('growthChart').getContext('2d');
let growthChart;

function validateInputs(values) {
  const errors = [];
  if (values.initialAmount < 0) errors.push('Initial amount must be non‑negative.');
  if (values.periodAmount < 0) errors.push('Contribution per period must be non‑negative.');
  if (values.duration < 1) errors.push('Duration must be at least 1 year.');
  if (values.annualReturn < 0) errors.push('Return rate must be non‑negative.');
  if (values.inflationRate < 0) errors.push('Inflation rate must be non‑negative.');
  return errors;
}

function runSimulation() {
  const values = {
    investmentType: document.getElementById('investmentType').value,
    periodicity: document.getElementById('periodicity').value,
    initialAmount: parseFloat(document.getElementById('initialAmount').value) || 0,
    periodAmount: parseFloat(document.getElementById('periodAmount').value) || 0,
    duration: parseInt(document.getElementById('duration').value) || 0,
    annualReturn: parseFloat(document.getElementById('annualReturn').value) || 0,
    inflationRate: parseFloat(document.getElementById('inflationRate').value) || 0
  };

  const errors = validateInputs(values);
  if (errors.length) {
    alert(errors.join('\\n'));
    return;
  }

  const periodsPerYear = { monthly: 12, quarterly: 4, yearly: 1 }[values.periodicity];
  const totalPeriods = values.duration * periodsPerYear;
  const monthlyRate = Math.pow(1 + values.annualReturn / 100, 1 / periodsPerYear) - 1;
  const inflationFactor = Math.pow(1 + values.inflationRate / 100, 1 / periodsPerYear);

  let cumulative = 0;
  const dataPoints = [];
  let totalInvested = values.initialAmount;

  // Initial lump sum
  cumulative += values.initialAmount;
  dataPoints.push({ period: 0, value: cumulative });

  for (let i = 1; i <= totalPeriods; i++) {
    let contribution = values.periodAmount;
    if (values.investmentType === 'sip') {
      contribution *= Math.pow(inflationFactor, i - 1);
    }
    totalInvested += contribution;
    cumulative = (cumulative + contribution) * (1 + monthlyRate);
    dataPoints.push({ period: i, value: cumulative });
  }

  const totalReturns = cumulative - totalInvested;
  const cagr = (Math.pow(cumulative / values.initialAmount, 1 / values.duration) - 1) * 100;

  totalInvestedEl.textContent = totalInvested.toFixed(2);
  totalReturnsEl.textContent = totalReturns.toFixed(2);
  cagrEl.textContent = cagr.toFixed(2) + '%';

  // Update chart
  const labels = dataPoints.map(dp => dp.period);
  const valuesChart = dataPoints.map(dp => dp.value.toFixed(2));

  if (growthChart) growthChart.destroy();
  growthChart = new Chart(chartCtx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Portfolio Value',
        data: valuesChart,
        borderColor: '#4ade80',
        backgroundColor: 'rgba(74, 222, 128, 0.1)',
        tension: 0.2,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { display: false },
        y: { beginAtZero: true }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

function resetForm() {
  form.reset();
  totalInvestedEl.textContent = '';
  totalReturnsEl.textContent = '';
  cagrEl.textContent = '';
  if (growthChart) growthChart.destroy();
}

function copySummary() {
  const summary = `
Total Invested: ${totalInvestedEl.textContent}
Total Returns: ${totalReturnsEl.textContent}
CAGR: ${cagrEl.textContent}
  `;
  navigator.clipboard.writeText(summary.trim()).then(() => {
    alert('Summary copied to clipboard!');
  });
}

  const values = {
    investmentType: document.getElementById('investmentType').value,
    periodicity: document.getElementById('periodicity').value,
    initialAmount: parseFloat(document.getElementById('initialAmount').value) || 0,
    periodAmount: parseFloat(document.getElementById('periodAmount').value) || 0,
    duration: parseInt(document.getElementById('duration').value) || 0,
    annualReturn: parseFloat(document.getElementById('annualReturn').value) || 0,
    inflationRate: parseFloat(document.getElementById('inflationRate').value) || 0
  };

  const periodsPerYear = { monthly: 12, quarterly: 4, yearly: 1 }[values.periodicity];
  const totalPeriods = values.duration * periodsPerYear;
  const monthlyRate = Math.pow(1 + values.annualReturn / 100, 1 / periodsPerYear) - 1;
  const inflationFactor = Math.pow(1 + values.inflationRate / 100, 1 / periodsPerYear);

  let cumulative = 0;
  let totalInvested = values.initialAmount;
  cumulative += values.initialAmount;

  const rows = [['Period', 'Contribution', 'Cumulative Value']];
  rows.push([0, values.initialAmount.toFixed(2), cumulative.toFixed(2)]);

  for (let i = 1; i <= totalPeriods; i++) {
    let contribution = values.periodAmount;
    if (values.investmentType === 'sip') {
      contribution *= Math.pow(inflationFactor, i - 1);
    }
    totalInvested += contribution;
    cumulative = (cumulative + contribution) * (1 + monthlyRate);
    rows.push([i, contribution.toFixed(2), cumulative.toFixed(2)]);
  }

  const csvContent = rows.map(r => r.join(',')).join('\\n
