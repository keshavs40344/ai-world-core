<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Workspace Authentication — Genesis Conglomerate</title>
    <meta name="description" content="Secure, Firebase & zero-server client authentication for Genesis Sovereign Conglomerate.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/genesis_ui.css">
    
    <!-- Firebase SDK (Compat v10 for universal static browser compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="assets/genesis_firebase_bridge.js"></script>
    
    <script src="assets/genesis_engine.js"></script>
    <script src="assets/genesis_payments_auth.js"></script>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .cyber-grid {
            background-image: 
              radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
              radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.08) 0%, transparent 45%),
              linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between cyber-grid antialiased selection:bg-emerald-500 selection:text-black">
    
    <!-- Header -->
    <header class="p-6 flex items-center justify-between max-w-7xl mx-auto w-full">
        <a href="index.html" class="flex items-center gap-2 text-xs font-mono font-bold text-slate-400 hover:text-emerald-400 transition">
            ← Back to Conglomerate Hub
        </a>
        <div id="genesisAuthWidget"></div>
    </header>

    <!-- Main Auth Card -->
    <main class="w-full max-w-md mx-auto p-4 sm:p-6 my-auto">
        <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-7 sm:p-8 shadow-2xl relative">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-cyan-500 flex items-center justify-center font-black text-slate-950 text-xl mx-auto mb-3 shadow-lg shadow-emerald-500/25">
                    Ω
                </div>
                <h1 id="pageAuthTitle" class="text-2xl font-black text-white tracking-tight">Sovereign Account</h1>
                <p class="text-xs text-slate-400 mt-1 font-mono">Firebase Auth &amp; Sovereign Client Workspace</p>
            </div>

            <!-- Firebase Google One-Tap Sign In -->
            <button onclick="handlePortalGoogleSignIn()" type="button" class="w-full py-3 px-4 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-700 hover:border-slate-500 text-white text-xs font-mono font-bold flex items-center justify-center gap-2.5 transition shadow-sm mb-4">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google (Firebase)</span>
            </button>

            <div class="relative my-4 text-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
                <span class="relative px-3 bg-slate-900 text-[10px] font-mono text-slate-500">OR EMAIL LOGIN</span>
            </div>

            <!-- Tab Switcher -->
            <div class="flex border-b border-slate-800 mb-5 text-center">
                <button id="tabSignInBtn" onclick="switchTab('login')" class="flex-1 py-2.5 text-xs font-bold text-white border-b-2 border-emerald-500 transition font-mono">
                    Sign In
                </button>
                <button id="tabRegisterBtn" onclick="switchTab('register')" class="flex-1 py-2.5 text-xs font-medium text-slate-400 hover:text-white transition font-mono">
                    Create Account
                </button>
            </div>

            <!-- Form -->
            <form id="portalAuthForm" onsubmit="event.preventDefault(); handlePortalSubmit();" class="space-y-4">
                <div id="nameFieldContainer" class="hidden">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 font-mono">Full Name</label>
                    <input id="portalName" type="text" placeholder="e.g. Keshav Sharma" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-emerald-500 font-mono transition">
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 font-mono">Account Email</label>
                    <input id="portalEmail" type="email" required placeholder="you@domain.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-emerald-500 font-mono transition">
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 font-mono">Password</label>
                    <input id="portalPass" type="password" required placeholder="••••••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-emerald-500 font-mono transition">
                </div>
                <button id="portalSubmitBtn" type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-xs py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/25 mt-2">
                    Enter Sovereign Workspace
                </button>
            </form>

            <div class="relative my-4 text-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
                <span class="relative px-3 bg-slate-900 text-[11px] font-mono text-slate-500">OR</span>
            </div>

            <button onclick="handleGuestEntry()" class="w-full py-2.5 rounded-xl border border-slate-800 hover:bg-slate-800/60 text-slate-300 text-xs font-mono transition">
                ⚡ Instant Guest Access
            </button>

            <!-- Bottom Support Trigger -->
            <div class="border-t border-slate-800/80 pt-5 mt-6 text-center">
                <p class="text-xs text-slate-400 mb-2">100% Free &amp; Open Source Conglomerate</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-xs font-mono text-slate-600">
        © 2026 Genesis Sovereign Conglomerate • Firebase &amp; Local WebCrypto SHA-256 Security
    </footer>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const tabSign = document.getElementById('tabSignInBtn');
            const tabReg = document.getElementById('tabRegisterBtn');
            const nameBox = document.getElementById('nameFieldContainer');
            const submitBtn = document.getElementById('portalSubmitBtn');
            const title = document.getElementById('pageAuthTitle');

            if (mode === 'login') {
                tabSign.className = "flex-1 py-2.5 text-xs font-bold text-white border-b-2 border-emerald-500 transition font-mono";
                tabReg.className = "flex-1 py-2.5 text-xs font-medium text-slate-400 hover:text-white transition font-mono";
                nameBox.classList.add('hidden');
                submitBtn.innerText = "Enter Sovereign Workspace";
                title.innerText = "Sign In to Account";
            } else {
                tabSign.className = "flex-1 py-2.5 text-xs font-medium text-slate-400 hover:text-white transition font-mono";
                tabReg.className = "flex-1 py-2.5 text-xs font-bold text-white border-b-2 border-emerald-500 transition font-mono";
                nameBox.classList.remove('hidden');
                submitBtn.innerText = "Create Free Account";
                title.innerText = "Create Sovereign Account";
            }
        }

        async function handlePortalGoogleSignIn() {
            if (window.GenesisFirebase) {
                const res = await window.GenesisFirebase.signInWithGoogle();
                if (res.success) {
                    alert(`Welcome ${res.user.displayName}! Signed in with Google Firebase.`);
                    window.location.href = "index.html";
                } else if (res.msg) {
                    alert(res.msg);
                }
            } else {
                alert("Firebase Auth bridge loading...");
            }
        }

        async function handlePortalSubmit() {
            const email = document.getElementById('portalEmail').value;
            const pass = document.getElementById('portalPass').value;
            const name = document.getElementById('portalName').value;

            if (currentMode === 'register') {
                const res = await GenesisAuth.register(email, pass, name);
                if (res.success) {
                    alert(`Account created! Welcome ${res.user.displayName}! Redirecting to Workspace...`);
                    window.location.href = "index.html";
                } else {
                    alert(res.msg);
                }
            } else {
                const res = await GenesisAuth.login(email, pass);
                if (res.success) {
                    alert(`Welcome back, ${res.user.displayName}! Redirecting to Workspace...`);
                    window.location.href = "index.html";
                } else {
                    alert(res.msg);
                }
            }
        }

        function handleGuestEntry() {
            const res = GenesisAuth.loginAsGuest();
            alert(`Logged in as ${res.user.displayName}! Redirecting...`);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
