name: VASTUDA 24x7 Autonomous World Evolution

on:
  schedule:
    # Runs autonomously every hour around the clock (100% Free on GitHub Actions)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  evolve-world:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Sovereign World
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Autonomous Evolution Cycle
        env:
          PYTHONUTF8: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python run_world.py --cycle

      - name: Commit Real World State & Newly Forged Creations
        run: |
          git config --global user.name "VASTUDA Sovereign Agent"
          git config --global user.email "agent@vastuda.ai"
          git add db/sovereign_world.db public/world_live.json creations/
          if git diff --staged --quiet; then
            echo "World in steady state, zero changes to commit."
          else
            git commit -m "feat(sovereign): autonomous world evolution cycle [skip ci]"
            git push
          fi
