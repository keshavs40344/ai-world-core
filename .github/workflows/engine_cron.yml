name: Genesis Headless Industrial Swarm

on:
  schedule:
    - cron: '0 */3 * * *'  # Har 3 ghante me automatic chalega 24/7
  workflow_dispatch:       # Manual Run button

jobs:
  run-enterprise:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Autonomous Master Brain
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GENESIS_SYSTEM_PROMPT: ${{ secrets.GENESIS_SYSTEM_PROMPT }}
        run: |
          python genesis_master_brain.py

      - name: Commit Staged Ventures & Pitch Reports
        run: |
          git config --global user.name "Genesis-Enterprise-Bot"
          git config --global user.email "bot@genesis.local"
          git add vault/ public/
          git diff-index --quiet HEAD || git commit -m "chore(swarm): new venture staged & chairman notified [skip ci]"
          git push
