name: Genesis Autonomous Swarm Daemon

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute 5-Agent Collaborative Swarm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_autonomous_swarm.py

      - name: Auto-Commit Generated Web Tools & Marketplace Specs
        run: |
          git config --global user.name "Genesis-Autonomous-Swarm"
          git config --global user.email "swarm@genesis.local"
          git add public/ vault/
          git diff-index --quiet HEAD || git commit -m "feat(swarm): autonomous product staged & cataloged [skip ci]"
          git push origin main
