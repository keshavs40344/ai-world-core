name: Genesis Zero-Approval Autonomous Swarm

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  evolve-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sovereign Autonomous Evolution
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_sovereign_evolution_core.py

      - name: Execute Titan Swarm Elite Factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_titan_swarm_core.py

      - name: Commit & Push New Generations Autonomously
        run: |
          git config --global user.name "Genesis-Autonomous-Swarm"
          git config --global user.email "swarm@genesis.internal"
          git add public/ db/ vault/
          git diff-index --quiet HEAD || git commit -m "feat(evolution): autonomous generation upgrade [skip ci]"
          git push origin main
