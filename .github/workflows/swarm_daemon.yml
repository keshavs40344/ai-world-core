name: Genesis Autonomous Swarm Daemon

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Conglomerate Cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_world_conglomerate.py

      - name: Auto-Commit & Deploy to Main
        run: |
          git config --global user.name "Genesis-Conglomerate-Engine"
          git config --global user.email "conglomerate@genesis.local"
          git add public/ vault/ db/
          git diff-index --quiet HEAD || git commit -m "feat(conglomerate): autonomous expansion & sitemap sync [skip ci]"
          git push origin main
