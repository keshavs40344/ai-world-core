name: Genesis 24/7 Sovereign Self-Healing Conglomerate

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-Flight Sentinel Integrity Check
        run: |
          python sentinel_self_healing_watchdog.py

      - name: Run Sovereign Autonomous Evolution
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_sovereign_evolution_core.py || echo "Sovereign evolution soft fallback triggered"

      - name: Execute Titan Swarm Elite Factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_titan_swarm_core.py || echo "Titan factory soft fallback triggered"

      - name: Run Cross-Sector Hyper-Evolution Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_hyper_evolution_engine.py || echo "Hyper-evolution soft fallback triggered"

      - name: Execute Agent Prime Sub-Agent Factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent_prime_orchestrator.py || echo "Agent Prime soft fallback triggered"

      - name: Post-Flight Self-Healing & Verification
        run: |
          python sentinel_self_healing_watchdog.py

      # Ultra Artisanal SaaS Builder & Programmatic SEO Subpage Indexer
      - name: Synthesize Ultra-Tier Artisanal SaaS Units
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_ultra_architect.py

      - name: Index Subpages for Googlebot & Rebuild Sitemaps
        run: |
          python seo_subpage_indexer.py

      - name: Inject SEO & OpenGraph Social Meta Tags
        run: |
          python seo_metatag_engine.py

      - name: Run Dr. Aegis Clinical Examination
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent_dr_aegis.py

      - name: Run Agent Mercury Outbound Broadcasts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python agent_mercury_broadcaster.py

      - name: Recompile Chairman Executive Dashboard
        run: |
          python build_chairman_dashboard.py

      - name: Autonomous Git Commit & Push
        run: |
          git config --global user.name "Genesis-Sentinel-Daemon"
          git config --global user.email "sentinel@genesis.world"
          git add public/ db/ vault/
          git diff-index --quiet HEAD || git commit -m "chore(sentinel): 24/7 self-healing and asset verification cycle [skip ci]"
          git push origin main

      - name: Send Instant Non-Blocking Telegram Release Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python genesis_telegram_notifier.py "Autonomous Swarm Cycle Completed" "public/index.html" "Conglomerate Core"
